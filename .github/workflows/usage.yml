name: Usage numbers

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/update-usage.mjs
      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "Alican Akyol"
          git config user.email "11759370+AlicanAkyol@users.noreply.github.com"
          git add site/index.html
          git commit -m "Site: weekly npm download numbers"
          git pull --rebase origin main
          git push origin HEAD:main
