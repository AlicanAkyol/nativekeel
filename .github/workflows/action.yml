name: Action
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the action on a fixture app
        id: nk
        uses: ./
        with:
          path: test/fixtures/action-app
          fail-on: never
          sarif: 'true'
      - name: Check the outputs
        run: |
          test -s "$RUNNER_TEMP/nativekeel.sarif"
          test -s "$RUNNER_TEMP/nativekeel.md"
          grep -q "allowBackup" "$RUNNER_TEMP/nativekeel.sarif"
          echo "exit code: ${{ steps.nk.outputs.exit-code }}"
  published-tag:
    # What users run: the v0 tag, not this checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AlicanAkyol/nativekeel@v0
        with:
          path: test/fixtures/action-app
          fail-on: never
