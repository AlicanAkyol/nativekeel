# Publishes to npm when a GitHub release is created, using npm trusted publishing (OIDC):
# no npm token is stored anywhere. npm checks that this repository and this workflow file
# are the trusted publisher configured for the package, and attaches provenance automatically.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm test
      - run: npm publish --access public
