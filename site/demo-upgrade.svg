<svg xmlns="http://www.w3.org/2000/svg" width="788" height="628" viewBox="0 0 788 628" role="img" aria-labelledby="t d">
<title id="t">npx nativekeel upgrade: NOT READY, 3 blockers in your code</title>
<desc id="d">$ npx nativekeel upgrade
Upgrade  React Native 0.84.1 → React Native 0.88.x
  NOT READY — 3 blockers in your code and dependencies
  ! React Native 0.84.1 is no longer supported

Blockers (fix before upgrading)
  ✗ [code · React Native 0.85] `StyleSheet.absoluteFillObject` is removed — 
    src/components/Overlay.js:13
      Use `StyleSheet.absoluteFill` (same values, can be spread). In JavaScript nothing fails: 
        overlays silently lose their absolute layout. 
        https://nativekeel.com/fix/stylesheet-absolutefillobject-removed-react-native-0-85
  ✗ [code · React Native 0.87] `InteractionManager` is removed — src/screens/Feed.js:2
      Use `requestIdleCallback` (or run the work after the interaction finishes). 
        https://nativekeel.com/fix/interactionmanager-removed-react-native-0-87
  ✗ [code · React Native 0.87] `StatusBar` `backgroundColor`, `translucent` and 
    `networkActivityIndicatorVisible` (props and setters) are removed — src/App.js:8
      Remove them from the React Native `StatusBar` (props are ignored; setter calls like 
        `StatusBar.setBackgroundColor` now throw). Edge-to-edge draws behind the status bar on 
        Android. expo-status-bar is not affected. 
        https://nativekeel.com/fix/statusbar-backgroundcolor-translucent-removed-react-native-0-87

What this cannot confirm:
  - Native library code and iOS/Android build settings beyond the checks above are not evaluated 
    here; build once on the target before shipping.
  - Breaking changes are matched from NativeKeel's catalog for the versions ahead of you (up to 
    React Native 0.88); a change not in the catalog is not reported.

Rather hand the upgrade over? We take on a few at a time: send this output to 
  hello@nativekeel.com for a fixed quote.</desc>
