name: NativeKeel
description: 'Health check for React Native and Expo apps: upgrade blockers, store rejections, crash risks, security and accessibility.'
author: Alican Akyol
branding:
  icon: anchor
  color: green
inputs:
  path:
    description: 'App folder (where package.json is)'
    default: .
  fail-on:
    description: 'Fail at this severity or above (critical, high, medium, low, never). Default: failOn in .nativekeel.json, else critical'
    default: ''
  baseline:
    description: 'Baseline file; only findings not in it are reported'
    default: ''
  sarif:
    description: 'Upload results to GitHub code scanning (needs `security-events: write`)'
    default: 'false'
  sonar:
    description: 'Write findings for SonarQube to this file (relative to the workspace); pass it to the scanner with sonar.externalIssuesReportPaths'
    default: ''
  artifact:
    description: 'A built app to scan for keys added at build time (APK, AAB or IPA from an earlier step, relative to the workspace); several separated by newlines'
    default: ''
  panel-token:
    description: 'Upload token of your NativeKeel team panel (closed beta), e.g. secrets.NATIVEKEEL_TOKEN. When set, the scan summary (no code) is sent to the panel'
    default: ''
  offline:
    description: 'Make no network requests (local checks only)'
    default: 'false'
  pr-comment:
    description: 'On pull requests, keep one comment up to date with the findings this pull request adds or fixes (needs `pull-requests: write`)'
    default: 'false'
  github-token:
    description: 'Token for the pull request comment'
    default: ${{ github.token }}
outputs:
  exit-code:
    description: 'Exit code of the scan (0 = nothing at or above fail-on)'
    value: ${{ steps.scan.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Run NativeKeel
      shell: bash
      env:
        NK_PATH: ${{ inputs.path }}
        NK_FAIL_ON: ${{ inputs.fail-on }}
        NK_BASELINE: ${{ inputs.baseline }}
        NK_SARIF: ${{ inputs.sarif }}
        NK_SONAR: ${{ inputs.sonar }}
        NK_ARTIFACT: ${{ inputs.artifact }}
        NATIVEKEEL_TOKEN: ${{ inputs.panel-token }}
        NK_OFFLINE: ${{ inputs.offline }}
      run: |
        args=("$NK_PATH" --markdown "$RUNNER_TEMP/nativekeel.md")
        [ -n "$NK_FAIL_ON" ] && args+=(--fail-on "$NK_FAIL_ON")
        [ -n "$NK_BASELINE" ] && args+=(--baseline "$NK_BASELINE")
        [ "$NK_SARIF" = "true" ] && args+=(--sarif "$RUNNER_TEMP/nativekeel.sarif")
        [ "$NK_OFFLINE" = "true" ] && args+=(--offline)
        [ -n "$NK_SONAR" ] && args+=(--sonar "$NK_SONAR")
        while IFS= read -r a; do [ -n "$a" ] && args+=(--artifact "$a"); done <<< "$NK_ARTIFACT"
        [ -n "$NATIVEKEEL_TOKEN" ] && [ "$NK_OFFLINE" != "true" ] && args+=(--upload)
        set +e
        node "$GITHUB_ACTION_PATH/bin/nativekeel.js" "${args[@]}"
        code=$?
        [ -f "$RUNNER_TEMP/nativekeel.md" ] && cat "$RUNNER_TEMP/nativekeel.md" >> "$GITHUB_STEP_SUMMARY"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
      id: scan
    - name: Upload SARIF
      if: ${{ inputs.sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ runner.temp }}/nativekeel.sarif
        category: nativekeel
    - name: Comment on the pull request
      if: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NK_PATH: ${{ inputs.path }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set +e
        out="$RUNNER_TEMP/nativekeel-comment.md"
        warn() { echo "::warning::NativeKeel: $1"; exit 0; }
        git -C "$NK_PATH" fetch --no-tags --quiet --depth=1 origin "$BASE_SHA" || warn "could not fetch the base commit, so no pull request comment."
        node "$GITHUB_ACTION_PATH/bin/nativekeel.js" verify "$NK_PATH" --base "$BASE_SHA" --comment "$out" --report-url "$RUN_URL" > /dev/null
        [ -s "$out" ] || warn "the comparison with the base commit failed, so no pull request comment."
        id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- nativekeel-pr-comment -->")) | .id' 2>/dev/null | head -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$out" > /dev/null || warn "could not update the pull request comment."
        else
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$out" > /dev/null || warn "could not comment. The job needs pull-requests: write; pull requests from forks only get a read-only token."
        fi
    - name: Fail on findings
      if: ${{ steps.scan.outputs.exit-code != '0' }}
      shell: bash
      run: exit ${{ steps.scan.outputs.exit-code }}
